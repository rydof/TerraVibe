[package]
name = "terravibe_client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "terravibe"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = ["wav"] }
terravibe_assets = { path = "../assets" }
terravibe_lobby = { path = "../lobby" }
terravibe_net = { path = "../net" }
terravibe_server = { path = "../server" }
terravibe_sim = { path = "../sim" }
png = "0.18.1"
ron = "0.12"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

